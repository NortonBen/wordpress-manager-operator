# Shared ReadWriteMany volume. EVERY WordPress host mounts this single claim,
# but each at its own subPath (the site name), so hosts share one volume while
# their files stay isolated in separate sub-folders.
#
# Most default provisioners (kind/minikube "local-path", hostpath) only support
# ReadWriteOnce, so a dynamically-provisioned RWX PVC stays Pending forever.
# To work out of the box we PRE-CREATE a static hostPath PV with RWX and bind
# the PVC to it explicitly (storageClassName: "" disables dynamic provisioning).
#
# ⚠️ hostPath is single-node only (kind / minikube / one-node clusters). For
# MULTI-NODE production replace this PV with a real shared filesystem — NFS,
# CephFS, Longhorn-RWX, AWS EFS, Azure Files, GCP Filestore — or a dynamic RWX
# StorageClass, and point the PVC at it (drop volumeName/claimRef, set the class).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wordpress-shared-pv
  labels:
    app.kubernetes.io/part-of: wordpress-manager-operator
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # static binding, no dynamic provisioner
  # Pre-bind to the exact claim so nothing else can grab this PV.
  claimRef:
    namespace: wordpress-sites
    name: wordpress-shared
  hostPath:
    path: /var/lib/wordpress-shared
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-shared
  namespace: wordpress-sites
  labels:
    app.kubernetes.io/part-of: wordpress-manager-operator
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "" # empty → bind to the static PV above, skip local-path
  volumeName: wordpress-shared-pv
  resources:
    requests:
      storage: 50Gi
