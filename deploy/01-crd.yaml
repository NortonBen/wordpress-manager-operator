apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wordpresssites.wp.benji.dev
spec:
  group: wp.benji.dev
  names:
    kind: WordPressSite
    listKind: WordPressSiteList
    plural: wordpresssites
    singular: wordpresssite
    shortNames: [wp, wpsite]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  minLength: 1
                aliases:
                  type: array
                  items: { type: string }
                image:
                  type: string
                replicas:
                  type: integer
                  format: int32
                  default: 1
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                storage:
                  type: object
                  properties:
                    sharedPVCName: { type: string }
                    subPath: { type: string }
                database:
                  type: object
                  properties:
                    name: { type: string }
                    user: { type: string }
                    host: { type: string, default: "%" }
                tls:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    issuer: { type: string }
                    secretName: { type: string }
                ingressClassName:
                  type: string
                ingressAnnotations:
                  type: object
                  additionalProperties: { type: string }
                env:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                phpConfig:
                  type: string
                phpIni:
                  type: string
                tablePrefix:
                  type: string
                  default: wp_
                suspend:
                  type: boolean
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase: { type: string }
                url: { type: string }
                databaseName: { type: string }
                databaseUser: { type: string }
                secretName: { type: string }
                observedGeneration: { type: integer, format: int64 }
