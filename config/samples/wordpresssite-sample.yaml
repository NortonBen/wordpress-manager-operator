apiVersion: wp.benji.dev/v1alpha1
kind: WordPressSite
metadata:
  name: blog-acme
  namespace: wordpress-sites
spec:
  domain: blog.acme.example
  aliases:
    - www.blog.acme.example
  # image: wordpress:latest   # optional override (default: wordpress:latest)
  replicas: 1
  tablePrefix: wp_
  tls:
    enabled: true
    issuer: letsencrypt-prod # cert-manager ClusterIssuer
  ingressAnnotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Anything appended verbatim to wp-config.php:
  phpConfig: |
    define('WP_MEMORY_LIMIT', '256M');
    define('DISALLOW_FILE_EDIT', true);
  # php.ini runtime settings (mounted into PHP conf.d; pod rolls out on change):
  phpIni: |
    upload_max_filesize = 64M
    post_max_size = 64M
    memory_limit = 256M
    max_execution_time = 120
# The operator will, on apply:
#   1. create database  wp_blog_acme  and user  wpu_blog_acme  (random password)
#   2. create Secret    blog-acme-wp  (DB password + WP salts)
#   3. create Deployment/Service mounting wordpress-shared at subPath=blog-acme
#   4. create Ingress binding blog.acme.example (+ alias) with TLS
