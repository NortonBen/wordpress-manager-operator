server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # In-cluster, the Ingress routes /api to the apiserver Service directly, so
    # this block is only a convenience for single-container demos. Uncomment and
    # point at your apiserver Service if you serve the API through this nginx.
    # location /api/ {
    #     proxy_pass http://wordpress-apiserver.wordpress-system.svc.cluster.local/;
    #     proxy_set_header Host $host;
    # }
}
