---
# Shared MySQL server. The operator connects with the admin (root) credentials
# to create a dedicated database + least-privilege user per WordPress host.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-admin
  namespace: wordpress-system
type: Opaque
stringData:
  # CHANGE THIS before production. Used by the operator as MYSQL_ADMIN_PASSWORD.
  MYSQL_ROOT_PASSWORD: "change-me-root-password"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: wordpress-system
  labels:
    app: mysql
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  clusterIP: None # headless, for the StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: wordpress-system
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          # Note: MySQL 8.4 removed --default-authentication-plugin;
          # caching_sha2_password is already the default. Use
          # --mysql-native-password=ON only if a client needs the legacy plugin.
          args:
            - --max_connections=512
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-admin
                  key: MYSQL_ROOT_PASSWORD
            # Allow root to connect from operator pods (other namespaces/IPs).
            - name: MYSQL_ROOT_HOST
              value: "%"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: standard   # set to your cluster's default if needed
        resources:
          requests:
            storage: 20Gi

---
# Shared ReadWriteMany volume. EVERY WordPress host mounts this single claim,
# but each at its own subPath (the site name), so hosts share one volume while
# their files stay isolated in separate sub-folders.
#
# IMPORTANT: ReadWriteMany requires a shared-filesystem provisioner —
# e.g. NFS (nfs-subdir-external-provisioner), CephFS, Longhorn-RWX, AWS EFS,
# Azure Files, GCP Filestore. Set storageClassName to that provisioner.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-shared
  namespace: wordpress-sites
  labels:
    app.kubernetes.io/part-of: wordpress-manager-operator
spec:
  accessModes:
    - ReadWriteMany
  # storageClassName: nfs-client    # <-- set to your RWX storage class
  resources:
    requests:
      storage: 50Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-operator
  namespace: wordpress-system
  labels:
    app: wordpress-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-operator
  template:
    metadata:
      labels:
        app: wordpress-operator
    spec:
      serviceAccountName: wordpress-operator
      containers:
        - name: operator
          image: wordpress-manager/operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              value: "mysql.wordpress-system.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_ADMIN_USER
              value: "root"
            - name: MYSQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-admin
                  key: MYSQL_ROOT_PASSWORD
            - name: SHARED_PVC_NAME
              value: "wordpress-shared"
            - name: INGRESS_CLASS
              value: "nginx"
            - name: DROP_DATA_ON_DELETE
              value: "false" # keep tenant data on site deletion by default
            - name: LEADER_ELECT
              value: "true"
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

---
# Admin REST API + auth. The React UI talks to this; it CRUDs WordPressSite CRs.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-apiserver
  namespace: wordpress-system
type: Opaque
stringData:
  # CHANGE THESE. ADMIN_PASSWORD is hashed in-memory at startup; for production
  # supply ADMIN_PASSWORD_HASH (bcrypt) instead and drop ADMIN_PASSWORD.
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "change-me-admin-password"
  JWT_SECRET: "change-me-to-a-long-random-string"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-apiserver
  namespace: wordpress-system
  labels:
    app: wordpress-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-apiserver
  template:
    metadata:
      labels:
        app: wordpress-apiserver
    spec:
      serviceAccountName: wordpress-apiserver
      containers:
        - name: apiserver
          image: wordpress-manager/apiserver:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: wordpress-apiserver
          env:
            - name: API_ADDR
              value: ":8090"
            - name: SITES_NAMESPACE
              value: "wordpress-sites"
            - name: MYSQL_HOST
              value: "mysql.wordpress-system.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: CORS_ORIGINS
              value: "*" # tighten to the UI origin in production
          ports:
            - containerPort: 8090
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-apiserver
  namespace: wordpress-system
spec:
  selector:
    app: wordpress-apiserver
  ports:
    - name: http
      port: 80
      targetPort: 8090

---
# React admin UI (served by nginx) + an Ingress that exposes both the UI and the
# /api path on a single admin hostname.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-ui
  namespace: wordpress-system
  labels:
    app: wordpress-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-ui
  template:
    metadata:
      labels:
        app: wordpress-ui
    spec:
      containers:
        - name: ui
          image: wordpress-manager/ui:latest
          imagePullPolicy: IfNotPresent
          env:
            # nginx proxies /api here so login works on direct access too.
            - name: API_UPSTREAM
              value: "http://wordpress-apiserver.wordpress-system.svc.cluster.local:80"
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-ui
  namespace: wordpress-system
spec:
  selector:
    app: wordpress-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-admin
  namespace: wordpress-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"
spec:
  ingressClassName: nginx
  rules:
    - host: admin.wordpress.local # <-- change to your admin hostname
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: wordpress-apiserver
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress-ui
                port:
                  number: 80
